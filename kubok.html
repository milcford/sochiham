<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кубок Сочи УКВ — подсчёт</title>
<style>
  body { font-family: system-ui, sans-serif; background:#faf7f4; margin:0; color:#1c1917; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:16px; padding:16px; margin:10px 0; }
  input, select { width:100%; padding:12px; margin:6px 0; font-size:16px; border-radius:12px; border:1px solid #e7e5e4; box-sizing:border-box; }
  button { width:100%; background:#e85d04; color:#fff; border:0; border-radius:14px; padding:14px; font-size:18px; font-weight:700; }
  .live { background:#1b7a3a; color:#fff; border-radius:16px; padding:16px; }
  .live strong { font-size:32px; display:block; }
  a { color:#e85d04; }
</style>
</head>
<body>
<main>
  <p><a href="index.html">На портал</a></p>
  <h1>Кубок Сочи, УКВ</h1>
  <p>18 октября 2026, три тура FM. 144 МГц — 1 очко за км, 430 МГц — 2, 1,2 ГГц — 3. В своём малом квадрате: 2, 2 и 3 очка. Повтор на том же диапазоне не считается.</p>
  <form class="card" onsubmit="addQso(event)">
    <input id="my-loc" placeholder="Ваш локатор, KN93" required>
    <input id="dx-call" list="calls" placeholder="Позывной корреспондента" required autocomplete="off">
    <datalist id="calls"></datalist>
    <input id="dx-loc" placeholder="Его локатор" required>
    <select id="band">
      <option value="144">144 МГц</option>
      <option value="430">430 МГц</option>
      <option value="1200">1,2 ГГц</option>
    </select>
    <button>Посчитать связь</button>
  </form>
  <div class="live"><small>Сумма</small><strong id="total">0</strong> очков</div>
  <div id="qso-list"></div>
</main>
<script>
const people = [];
fetch('http://' + location.hostname + ':8081/api/calls').then(r => r.json()).then(list => {
  people.push(...list);
  document.getElementById('calls').innerHTML = list.map(p => '<option value="' + p.callsign + '">' + p.callsign + ' ' + (p.name || '') + '</option>').join('');
}).catch(() => {});
document.getElementById('dx-call').addEventListener('change', () => {
  const call = document.getElementById('dx-call').value.trim().toUpperCase();
  const found = people.find(p => p.callsign === call);
  if (found && found.locator) document.getElementById('dx-loc').value = found.locator;
});
function locToDeg(raw) {
  const s = raw.trim().toUpperCase();
  if (!/^[A-R]{2}[0-9]{2}([A-X]{2})?$/.test(s)) return null;
  let lon = (s.charCodeAt(0) - 65) * 20 + (s.charCodeAt(2) - 48) * 2 - 180;
  let lat = (s.charCodeAt(1) - 65) * 10 + (s.charCodeAt(3) - 48) * 1 - 90;
  if (s.length === 6) {
    lon += (s.charCodeAt(4) - 65) * (2 / 24) + (2 / 48);
    lat += (s.charCodeAt(5) - 65) * (1 / 24) + (1 / 48);
  } else { lon += 1; lat += 0.5; }
  return { lat, lon };
}
function kmBetween(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}
const rates = { "144": [1, 2], "430": [2, 2], "1200": [3, 3] };
const seen = new Set();
let total = 0;
function addQso(e) {
  e.preventDefault();
  const mine = locToDeg(document.getElementById("my-loc").value);
  const dx = locToDeg(document.getElementById("dx-loc").value);
  const call = document.getElementById("dx-call").value.trim().toUpperCase();
  const band = document.getElementById("band").value;
  if (!mine || !dx) { alert("Локатор вида KN93 или KN93uo"); return; }
  const key = call + "|" + band;
  if (seen.has(key)) { alert("Повтор на этом диапазоне не засчитывается"); return; }
  seen.add(key);
  const same = document.getElementById("my-loc").value.trim().toUpperCase().slice(0, 4) === document.getElementById("dx-loc").value.trim().toUpperCase().slice(0, 4);
  const dist = kmBetween(mine, dx);
  const pts = same ? rates[band][1] : Math.round(dist * rates[band][0]);
  total += pts;
  document.getElementById("total").textContent = total;
  const row = document.createElement("div");
  row.className = "card";
  row.innerHTML = "<b>" + call + " · " + band + "</b><p>" + (same ? "свой малый квадрат" : Math.round(dist) + " км") + " · " + pts + " очков</p>";
  document.getElementById("qso-list").prepend(row);
}
</script>
</body>
</html>
