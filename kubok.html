<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кубок Сочи УКВ — подсчёт</title>
<style>
  body { font-family: system-ui, sans-serif; background:#faf7f4; margin:0; color:#1c1917; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:16px; padding:16px; margin:10px 0; }
  label { display:block; margin-top:10px; font-weight:700; }
  input, select { width:100%; padding:12px; margin:6px 0; font-size:16px; border-radius:12px; border:1px solid #e7e5e4; box-sizing:border-box; }
  button { width:100%; background:#e85d04; color:#fff; border:0; border-radius:14px; padding:14px; font-size:18px; font-weight:700; margin-top:12px; }
  .live { background:#1b7a3a; color:#fff; border-radius:16px; padding:16px; }
  .live strong { font-size:32px; display:block; }
  a { color:#e85d04; }
</style>
</head>
<body>
<main>
  <p><a href="index.html">На портал</a></p>
  <h1>Кубок Сочи, УКВ</h1>
  <p>18 октября 2026. Очки — за километры связи: 144 МГц — 1 за км, 430 МГц — 2, 1,2 ГГц — 3.</p>
  <form class="card" onsubmit="addQso(event)">
    <label>Ваш позывной</label>
    <input id="my-call" list="calls" placeholder="Из списка базы" required autocomplete="off">
    <label>Позывной корреспондента</label>
    <input id="dx-call" list="calls" placeholder="С кем была связь" required autocomplete="off">
    <datalist id="calls"></datalist>
    <label>Километры связи</label>
    <input id="km" type="number" min="0" step="1" placeholder="Сколько км" required>
    <label>Диапазон</label>
    <select id="band">
      <option value="144">144 МГц, 1 очко за км</option>
      <option value="430">430 МГц, 2 очка за км</option>
      <option value="1200">1,2 ГГц, 3 очка за км</option>
    </select>
    <button>Посчитать связь</button>
  </form>
  <div class="live"><small>Сумма</small><strong id="total">0</strong> очков</div>
  <div id="qso-list"></div>
</main>
<script>
fetch('http://' + location.hostname + ':8081/api/calls').then(r => r.json()).then(list => {
  document.getElementById('calls').innerHTML = list.map(p => '<option value="' + p.callsign + '">' + p.callsign + ' ' + (p.name || '') + '</option>').join('');
}).catch(() => {});
const rates = { "144": 1, "430": 2, "1200": 3 };
const seen = new Set();
let total = 0;
function addQso(e) {
  e.preventDefault();
  const myCall = document.getElementById("my-call").value.trim().toUpperCase();
  const call = document.getElementById("dx-call").value.trim().toUpperCase();
  const km = Number(document.getElementById("km").value);
  const band = document.getElementById("band").value;
  const key = myCall + "|" + call + "|" + band;
  if (seen.has(key)) { alert("Повтор на этом диапазоне не засчитывается"); return; }
  seen.add(key);
  const pts = Math.round(km * rates[band]);
  total += pts;
  document.getElementById("total").textContent = total;
  const row = document.createElement("div");
  row.className = "card";
  row.innerHTML = "<b>" + myCall + " — " + call + " · " + band + "</b><p>" + km + " км · " + pts + " очков</p>";
  document.getElementById("qso-list").prepend(row);
  document.getElementById("dx-call").value = "";
  document.getElementById("km").value = "";
}
</script>
</body>
</html>
