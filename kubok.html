<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кубок Сочи УКВ — подсчёт</title>
<style>
  body { font-family: system-ui, sans-serif; background:#faf7f4; margin:0; color:#1c1917; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:16px; padding:16px; margin:10px 0; }
  label { display:block; margin-top:10px; font-weight:700; }
  input, select { width:100%; padding:12px; margin:6px 0; font-size:16px; border-radius:12px; border:1px solid #e7e5e4; box-sizing:border-box; }
  button { width:100%; background:#e85d04; color:#fff; border:0; border-radius:14px; padding:14px; font-size:18px; font-weight:700; margin-top:12px; }
  button.ghost { background:#fff; color:#9a3412; border:1px solid #e85d04; }
  .ok { border-left:6px solid #1b7a3a; }
  .wait { border-left:6px solid #b45309; }
  a { color:#e85d04; }
</style>
</head>
<body>
<main>
  <p><a href="index.html">На портал</a></p>
  <h1>Кубок Сочи, УКВ</h1>
  <p>18 октября 2026. Очки — за километры: 144 МГц — 1, 430 МГц — 2, 1,2 ГГц — 3. Каждый пишет связь со своей стороны. Сверка соединяет пару, чтобы одна связь не считалась дважды.</p>
  <form class="card" onsubmit="addQso(event)">
    <label>Ваш позывной</label>
    <input id="my-call" list="calls" required autocomplete="off">
    <label>Позывной корреспондента</label>
    <input id="dx-call" list="calls" required autocomplete="off">
    <datalist id="calls"></datalist>
    <label>Время связи</label>
    <input id="when" type="datetime-local" required>
    <label>Километры связи</label>
    <input id="km" type="number" min="0" step="1" required>
    <label>Диапазон</label>
    <select id="band">
      <option value="144">144 МГц, 1 очко за км</option>
      <option value="430">430 МГц, 2 очка за км</option>
      <option value="1200">1,2 ГГц, 3 очка за км</option>
    </select>
    <button>Сохранить связь</button>
  </form>
  <button class="ghost" type="button" onclick="loadCheck()">Сверить записи</button>
  <div id="qso-list"></div>
</main>
<script>
const api = 'http://' + location.hostname + ':8081';
const now = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
document.getElementById('when').value = now;
fetch(api + '/api/calls').then(r => r.json()).then(list => {
  document.getElementById('calls').innerHTML = list.map(p => '<option value="' + p.callsign + '">' + p.callsign + ' ' + (p.name || '') + '</option>').join('');
}).catch(() => {});
const rates = { "144": 1, "430": 2, "1200": 3 };
async function addQso(e) {
  e.preventDefault();
  const body = new URLSearchParams({
    my_call: document.getElementById('my-call').value.trim().toUpperCase(),
    dx_call: document.getElementById('dx-call').value.trim().toUpperCase(),
    when: document.getElementById('when').value,
    km: document.getElementById('km').value,
    band: document.getElementById('band').value,
    points: String(Math.round(Number(document.getElementById('km').value) * rates[document.getElementById('band').value]))
  });
  const res = await fetch(api + '/api/qso', { method: 'POST', body });
  if (!res.ok) { alert('Не сохранилось. Проверьте, что админка запущена.'); return; }
  document.getElementById('dx-call').value = '';
  document.getElementById('km').value = '';
  loadCheck();
}
async function loadCheck() {
  const rows = await fetch(api + '/api/qso').then(r => r.json());
  document.getElementById('qso-list').innerHTML = rows.map(r => '<div class="card ' + (r.pair === 'yes' ? 'ok' : 'wait') + '"><b>' + r.my_call + ' — ' + r.dx_call + ' · ' + r.band + '</b><p>' + r.worked_at + ' · ' + r.km + ' км · ' + r.points + ' очков</p><p>' + (r.pair === 'yes' ? 'Есть запись с обеих сторон, это одна связь' : 'Ждёт подтверждения от второй стороны') + '</p></div>').join('');
}
loadCheck();
</script>
</body>
</html>
