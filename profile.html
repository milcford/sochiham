<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет — радиолюбители Сочи</title>
<style>
  body { margin:0; font-family:"Segoe UI", system-ui, sans-serif; background:#f6f7f6; color:#1c1917; }
  main { max-width:640px; margin:0 auto; padding:24px 16px; }
  .card { background:#fff; border-radius:16px; padding:16px; margin:12px 0; }
  input, textarea, select { width:100%; box-sizing:border-box; padding:12px; margin:8px 0; font-size:16px; border:1px solid #e7e5e4; border-radius:12px; font-family:inherit; background:#fff; }
  label { display:flex; gap:8px; align-items:center; margin:8px 0; }
  button, a.btn { display:block; width:100%; box-sizing:border-box; text-align:center; text-decoration:none; background:#1f6b45; color:#fff; border:0; border-radius:12px; padding:14px; font-size:18px; font-weight:700; margin-top:8px; }
  a.ghost { background:#fff; color:#1f6b45; border:2px solid #1f6b45; }
  a { color:#1f6b45; }
  .call { font-size:28px; font-weight:800; margin:0; }
  .err { color:#b91c1c; }
  .ok { color:#1b7a3a; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid #f5f5f4; }

  .sitehead, header.sitehead { background:#fff; border-bottom:1px solid #e4e7e4; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; gap:16px; }
  .sitehead b { font-size:18px; }
  .sitehead .user { color:#1f6b45; text-decoration:none; font-weight:700; margin-left:auto; width:auto; }
  .sitenav { display:flex; gap:4px; flex-wrap:wrap; background:#fff; border-bottom:1px solid #e4e7e4; padding:0 12px; }
  .sitenav a, .sitenav button { color:#5e6a62; text-decoration:none; font-weight:650; padding:10px 12px; border:0; border-bottom:2px solid transparent; background:transparent; width:auto; font-size:15px; cursor:pointer; border-radius:0; margin:0; }
  .sitenav a.on, .sitenav button.on { color:#1a1f1c; border-bottom-color:#1f6b45; }
</style>
</head>
<body>
<header class="sitehead"><b>Радиолюбители Сочи</b><a class="user" id="who-link" href="login.html">Войти</a></header>
<nav class="sitenav">
  <a href="index.html">Главная</a>
  <a href="index.html#air">Эфир</a>
  <a href="index.html#people">Люди</a>
  <a href="index.html#photo">Фото</a>
  <a href="index.html#video">Видео</a>
  <a href="index.html#ads">Объявления</a>
  <a href="chat.html">Чат</a>
  <a href="kubok.html">Кубок</a>
  <a href="vedushchiy.html">Ведущему</a>
</nav>
<script>
const who=document.cookie.match(/ham_call=([^;]+)/);
if(who){const a=document.getElementById("who-link"); if(a){a.textContent=decodeURIComponent(who[1]); a.href="profile.html";}}
</script>
<main>
  <h1>Кабинет</h1>
  <div class="card">
    <p class="call" id="call">...</p>
    <div id="card"></div>
  </div>
  <form class="card" id="edit">
    <div style="text-align:center;margin-bottom:12px">
      <img id="avatar" src="" alt="" style="width:120px;height:120px;object-fit:cover;border-radius:50%;background:#f3f4f3;display:none">
      <div id="avatar-placeholder" style="width:120px;height:120px;border-radius:50%;background:#f3f4f3;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#8a938c">Фото</div>
    </div>
    <input type="file" id="photo" accept="image/*" style="margin-bottom:8px">
    <button type="button" class="btn ghost" onclick="uploadPhoto()" style="margin-bottom:12px">Загрузить фото</button>
    <p id="photo-status" style="color:#8a938c;font-size:13px"></p>
    <input name="new_callsign" id="new_callsign" placeholder="Новый позывной (если нужно сменить)" maxlength="12">
    <input name="surname" id="surname" placeholder="Фамилия">
    <input name="name" id="name" placeholder="Имя" required>
    <input name="patronymic" id="patronymic" placeholder="Отчество">
    <input name="city" id="city" placeholder="Город">
    <select name="locator" id="locator"><option value="">Локатор</option></select>
    <input name="locator_custom" id="locator_custom" placeholder="Точный квадрат, например KN93uo" maxlength="6" style="text-transform:uppercase;display:none;margin-top:6px">
    <input name="phone" id="phone" placeholder="Телефон">
    <input name="birth_date" id="birth_date" type="date" min="1920-01-01" max="2026-12-31" title="Дата рождения">
    <input name="email" id="email" type="email" placeholder="Почта" required>
    <textarea name="about" id="about" rows="3" placeholder="Коротко о себе"></textarea>
    <label><input type="checkbox" name="show_phone" id="show_phone" style="width:auto"> Показывать телефон всем</label>
    <label><input type="checkbox" name="show_birth" id="show_birth" style="width:auto"> Показывать год рождения всем</label>
    <p class="err" id="err"></p>
    <p class="ok" id="ok"></p>
    <button id="save">Сохранить</button>
  </form>
  <a class="btn" href="chat.html">Открыть чат</a>
  <a class="btn ghost" href="/api/logout">Выйти</a>
</main>
<script>
const fields = ["surname","name","patronymic","city","locator","phone","birth_date","email","about"];
function line(title, value){ return value ? '<div class="row"><span>'+title+'</span><b>'+value+'</b></div>' : ''; }
fetch("/api/me").then(r=>r.json()).then(async me=>{
  if(!me.callsign){ location.href="login.html"; return; }
  document.getElementById("call").textContent = me.callsign;
  const av = document.getElementById("avatar");
  const ph = document.getElementById("avatar-placeholder");
  av.src = "/photos/profiles/" + me.callsign + ".jpg?" + Date.now();
  av.onload = () => { av.style.display = "block"; ph.style.display = "none"; };
  av.onerror = () => { av.style.display = "none"; ph.style.display = "flex"; };
  fields.forEach(id => { const el=document.getElementById(id); if(el && id!=="locator") el.value = me[id] || ""; });
  const loc = document.getElementById("locator");
  const custom = document.getElementById("locator_custom");
  const list = await fetch("/api/locators").then(r=>r.json()).catch(()=>[]);
  loc.innerHTML = '<option value="">Локатор</option>' + list.map(x=>'<option value="'+x.code+'">'+x.code+' — '+x.title+'</option>').join("") + '<option value="__custom__">Свой точный квадрат</option>';
  if(me.locator && list.some(x=>x.code===me.locator)) loc.value = me.locator;
  else if(me.locator){ loc.value="__custom__"; custom.value=me.locator; custom.style.display="block"; }
  loc.onchange = () => { custom.style.display = loc.value==="__custom__" ? "block" : "none"; if(loc.value!=="__custom__") custom.value=""; };
  document.getElementById("show_phone").checked = !!me.show_phone;
  document.getElementById("show_birth").checked = !!me.show_birth;
  document.getElementById("card").innerHTML =
    line("Имя", [me.surname, me.name, me.patronymic].filter(Boolean).join(" ")) +
    line("Город", me.city) + line("Локатор", me.locator) +
    line("Телефон", me.phone) + line("Дата рождения", me.birth_date ? me.birth_date.split("-").reverse().join(".") : "") +
    line("Почта", me.email) + line("О себе", me.about);
});
document.getElementById("edit").onsubmit = async (e) => {
  e.preventDefault();
  const loc = document.getElementById("locator");
  const custom = document.getElementById("locator_custom");
  if(loc.value === "__custom__") loc.value = (custom.value || "").trim().toUpperCase();
  const err = document.getElementById("err");
  const ok = document.getElementById("ok");
  const button = document.getElementById("save");
  err.textContent = "";
  ok.textContent = "";
  button.disabled = true;
  button.textContent = "Сохраняю...";
  try {
    const res = await fetch("/api/profile", { method:"POST", body:new URLSearchParams(new FormData(e.target)) });
    const data = await res.json().catch(()=>({}));
    if(!res.ok){ err.textContent = data.error || "Не сохранилось"; return; }
    ok.textContent = "Сохранено";
    location.reload();
  } catch (e) {
    err.textContent = "Сервер не ответил";
  } finally {
    button.disabled = false;
    button.textContent = "Сохранить";
  }
};
async function uploadPhoto(){
  const input = document.getElementById("photo");
  const status = document.getElementById("photo-status");
  if(!input.files.length){ status.textContent = "Выберите фото"; return; }
  status.textContent = "Загружаю...";
  const file = input.files[0];
  const data = await new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const max = 400;
      let w = img.width, h = img.height;
      if(w > max || h > max){
        if(w > h){ h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(""); };
    img.src = url;
  });
  if(!data){ status.textContent = "Не удалось прочитать фото"; return; }
  const res = await fetch("/api/profile/photo", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({data})});
  const json = await res.json();
  if(!res.ok){ status.textContent = json.error || "Не загрузилось"; return; }
  status.textContent = "Фото сохранено";
  const av = document.getElementById("avatar");
  av.src = "/photos/profiles/" + document.getElementById("call").textContent + ".jpg?" + Date.now();
  av.style.display = "block";
  document.getElementById("avatar-placeholder").style.display = "none";
}
</script>
</body>
</html>
